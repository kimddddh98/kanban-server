name: Deploy production image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and push image to ECR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:latest
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:sha-${{ github.sha }}

  deploy:
    name: Deploy image to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to EC2 via SSM
        run: |
          cat > ssm-parameters.json <<'PARAMETERS'
          {
            "commands": [
              "cd ${{ vars.EC2_DEPLOY_PATH }}",
              "git pull",
              "printf \"DB_USERNAME=%s\\nDB_PASSWORD=%s\\nDB_DATABASE=%s\\n\" \"$(aws ssm get-parameter --region ${{ vars.AWS_REGION }} --name /kanban/prod/DB_USERNAME --query Parameter.Value --output text)\" \"$(aws ssm get-parameter --region ${{ vars.AWS_REGION }} --name /kanban/prod/DB_PASSWORD --with-decryption --query Parameter.Value --output text)\" \"$(aws ssm get-parameter --region ${{ vars.AWS_REGION }} --name /kanban/prod/DB_DATABASE --query Parameter.Value --output text)\" > .env",
              "chmod 600 .env",
              "aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ vars.ECR_REGISTRY }}",
              "docker compose -f docker-compose.prod.yml pull --quiet api",
              "docker compose -f docker-compose.prod.yml up -d --quiet-pull",
              "docker compose -f docker-compose.prod.yml ps"
            ],
            "executionTimeout": ["900"]
          }
          PARAMETERS

          COMMAND_ID=$(aws ssm send-command \
            --region "${{ vars.AWS_REGION }}" \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy kanban-server from ECR" \
            --timeout-seconds 900 \
            --parameters file://ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)

          set +e
          aws ssm wait command-executed \
            --region "${{ vars.AWS_REGION }}" \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"
          WAIT_EXIT_CODE=$?
          set -e

          aws ssm get-command-invocation \
            --region "${{ vars.AWS_REGION }}" \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '{Status:Status,ResponseCode:ResponseCode,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}' \
            --output json

          exit "$WAIT_EXIT_CODE"
